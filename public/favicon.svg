<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Pokéball">
  <title>Pokéball</title>
  <!-- White base + outer ink border -->
  <circle cx="16" cy="16" r="14" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Red top hemisphere -->
  <path d="M 2 16 A 14 14 0 0 1 30 16 Z" fill="#dc2626"/>
  <!-- Equator band -->
  <line x1="2" y1="16" x2="30" y2="16" stroke="#0a0a0a" stroke-width="3"/>
  <!-- Central button (white with ink ring + filled core) -->
  <circle cx="16" cy="16" r="4.5" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/>
  <circle cx="16" cy="16" r="1.6" fill="#0a0a0a"/>
</svg>
