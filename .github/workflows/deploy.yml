name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Single in-flight deploy; queue subsequent runs without cancelling
# an already-running release.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build --base-href "/poke-angular/"

      - name: SPA routing fallback
        # GH Pages serves 404.html for any unknown path. Cloning index.html
        # into 404.html lets the Angular Router pick up the URL on the
        # client side instead of the user seeing a real 404.
        run: cp dist/poke-angular/browser/index.html dist/poke-angular/browser/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/poke-angular/browser

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
